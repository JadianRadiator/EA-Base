on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Decomp Workspace
        run: ./gradlew setupDecompWorkspace

      - name: Build with Gradle
        run: ./gradlew build

      - name: Install GitHub CLI
        run: sudo apt-get install gh

      - name: Create Release
        run: |
          gh release create full-release --title "Full Release" --notes "Final release build" || echo "Release already exists"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Cleaned Artifacts to Release
        run: |
          mkdir -p release-artifacts
          for artifact in ./build/libs/*.jar; do
            clean_name=$(basename "$artifact" | sed 's/\.dirty//g')
            cp "$artifact" "release-artifacts/$clean_name"
            echo "Uploading $clean_name"
            gh release upload full-release "release-artifacts/$clean_name" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
